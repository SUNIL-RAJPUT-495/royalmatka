name: Deploy Royal Matka

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/royalmatka_github
          chmod 600 ~/.ssh/royalmatka_github

      - name: Test SSH
        run: |
          ssh \
            -i ~/.ssh/royalmatka_github \
            -o StrictHostKeyChecking=no \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "echo SSH_CONNECTION_SUCCESS"

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/royalmatka_github \
            -o StrictHostKeyChecking=no \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

            set -e

            cd /var/www/royalmatka

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Deploying backend..."
            cd api
            npm install --production
            pm2 restart royalmatka-api

            echo "Deploying frontend..."
            cd ../view
            npm install
            npm run build

            echo "Saving PM2..."
            pm2 save

            echo "DEPLOYMENT SUCCESSFUL"

          EOF